<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato | Pixel Jump</title>
<link rel="icon" href="Imagem_Logo.jpg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
  <a class="marca" href="index.html"><img src="Imagem_Logo.jpg" alt=""><span>Pixel Jump</span></a>
  <nav class="menu">
    <a href="index.html">Início</a>
    <a href="servicos.html">Serviços</a>
    <a href="contato.html" aria-current="page">Contato</a>
  </nav>
</header>
<main class="bloco">
  <h2>Fale com a gente</h2>
  <p class="sub">Tem uma ideia de jogo ou encontrou um problema? Conte para nós.</p>
  <div class="contato">
    <form id="form" action="#" method="post">
      <label for="nome">Nome
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required minlength="3" maxlength="50"></label>
      <label for="email">E-mail
        <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required></label>
      <label for="assunto">Assunto
        <select id="assunto" name="assunto">
          <option>Ideia de jogo</option>
          <option>Parceria</option>
          <option>Problema no site</option>
        </select></label>
      <label for="mensagem">Mensagem
        <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva aqui" required minlength="10"></textarea></label>
      <label class="termos" for="termos"><input type="checkbox" id="termos" name="termos" required> Li e aceito os termos</label>
      <div class="acoes">
        <button type="submit" class="btn">Enviar mensagem</button>
        <button type="reset" class="btn">Limpar</button>
      </div>
      <p id="ok" role="status">Mensagem enviada! Responderemos em breve.</p>
    </form>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2847.845843654491!2d-49.9715657!3d-20.435993699999997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94bd5ed3407ca22d%3A0x4a5bd12c9b9d678f!2sSENAI%20-%20VOTUPORANGA!5e1!3m2!1spt-BR!2sbr!4v1793712969720!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
</main>
<script>
document.getElementById('form').addEventListener('submit',function(e){
  e.preventDefault();
  document.getElementById('ok').style.display='block';
  this.reset();
});
</script>
<footer class="rodape"><p>© 2026 Pixel Jump · Jogos feitos pixel por pixel.</p></footer>
</body>
</html>
